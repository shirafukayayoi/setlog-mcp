name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1を固定
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0を固定
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 開発依存関係をインストール
        run: python -m pip install -e ".[dev]"
      - name: 静的チェック
        run: python -m ruff check .
      - name: フォーマット確認
        run: python -m ruff format --check .
      - name: 外部通信なしのテスト
        run: python -m pytest -q
      - name: 配布物をビルド
        run: python -m build
