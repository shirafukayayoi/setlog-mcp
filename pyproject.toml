[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "setlog-mcp"
version = "0.2.0"
description = "本人のsetlogへ暗号化したMP4動画を添付する非公式のローカルMCPサーバー"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "shirafukayayoi"}]
dependencies = ["cryptography>=46,<47", "mcp>=1.26,<2", "pydantic>=2.11,<3", "tzdata>=2025.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.14,<1"]

[project.scripts]
setlog-mcp = "setlog_mcp.__main__:main"
setlog-auth = "setlog_mcp.client:main"
setlog-upload = "setlog_mcp.upload:main"
setlog-worker = "setlog_mcp.worker:main"

[project.urls]
Repository = "https://github.com/shirafukayayoi/setlog-mcp"
Issues = "https://github.com/shirafukayayoi/setlog-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
